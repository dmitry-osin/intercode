# ─────────────────────────────────────────────────────────────────────────────
# InterCode — nginx: статика + проксирование API и WebSocket на сервер.
# Монтируется в образ фронтенда как /etc/nginx/conf.d/default.conf.
#
# Топология (docker-compose):  клиент → nginx (web) → intercode-server:8090
# ─────────────────────────────────────────────────────────────────────────────

upstream intercode_backend {
    # Имя сервиса в docker-compose.yml. Для запуска без compose замените
    # на адрес хоста, где слушает сервер (например, 127.0.0.1:8090).
    server server:8090;
}

server {
    listen 80;
    server_name _; # замените на ваш домен, например: intercode.example.com

    root /usr/share/nginx/html;
    index index.html;

    # Статика фронтенда с content-hashed именами — агрессивный кэш.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTTP API сессий: создание, метаданные, экспорт снапшотов.
    location /api/ {
        proxy_pass http://intercode_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket комнат: /ws/<sessionId>?r=..&k=..&name=..
    location /ws/ {
        proxy_pass http://intercode_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Долгоживущие соединения: сервер шлёт ping каждые 15 c,
        # но даём запас, чтобы не рвать сессию посреди собеседования.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: маршруты в хэше (#/s/<id>), поэтому достаточно отдавать index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Базовые security-заголовки.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

