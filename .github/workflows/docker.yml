# ─────────────────────────────────────────────────────────────────────────────
# InterCode — сборка и публикация Docker-образов в GitHub Container Registry.
#
# Образы:
#   ghcr.io/<owner>/<repo>-web     — nginx + собранный фронтенд
#   ghcr.io/<owner>/<repo>-server  — Node.js сервер (WS/Yjs/телеметрия/API)
#
# Триггеры:
#   - push в main (и ветки)        → теги: latest, sha-<commit>, <branch>
#   - теги вида v1.2.3             → теги: 1.2.3, 1.2, latest
#   - вручную (Actions → Run workflow)
#
# Для публикации в GHCR дополнительной настройки не нужно: используется
# встроенный GITHUB_TOKEN (packages: write). Образы появятся в разделе
# Packages репозитория. Сделайте их public: Package settings → Change visibility.
# ─────────────────────────────────────────────────────────────────────────────

name: Docker images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ── Сервер: Node.js WebSocket/API ───────────────────────────────────────────
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=intercode-server
          cache-to: type=gha,mode=max,scope=intercode-server

  # ── Фронтенд: сборка Vite + nginx ───────────────────────────────────────────
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.vps
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'IntQst' }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=intercode-web
          cache-to: type=gha,mode=max,scope=intercode-web
